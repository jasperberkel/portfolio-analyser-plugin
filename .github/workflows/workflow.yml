name: Native OAuth and workflow contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python plugins/portfolio-analyser/scripts/workflow.py discover
      - run: python -m pip install .
      - run: python tests/smoke_advisory_mcp.py
