name: Native OAuth and workflow contracts

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/thomas/evals -v
      - run: node --test tests/wake.test.mjs
      - run: python plugins/portfolio-analyser/scripts/workflow.py discover
      - name: Smoke-test the installed wheel from outside the checkout
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/smoke_advisory_mcp.py"
