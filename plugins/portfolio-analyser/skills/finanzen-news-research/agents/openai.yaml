interface:
  display_name: "finanzen.net News Research"
  short_description: "finanzen.net-News als Bericht in der App speichern"
  default_prompt: "Use $finanzen-news-research to publish a sourced German news report, distinguishing lasting material developments from short-term headlines without trade instructions."
dependencies:
  tools:
    - type: "mcp"
      value: "portfolio_analyser"
      description: "Lokale Portfolio-App zum Speichern und Prüfen vollständiger Nachrichtenberichte"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
