interface:
  display_name: "Market Opportunity Research"
  short_description: "Aktuelle Marktchancen recherchieren und bewerten"
  default_prompt: "Use $market-opportunity-research to assess up to eight evidence-backed market opportunities, separating business quality from price attractiveness without using my portfolio."
dependencies:
  tools:
    - type: "mcp"
      value: "portfolio_analyser"
      description: "Lokale Portfolio-App zum Speichern vollständiger Marktberichte"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
