interface:
  display_name: "Portfolio Briefing"
  short_description: "Konkrete Portfolioaktionen aus allen Berichten"
  default_prompt: "Use $portfolio-briefing to update my ongoing allocation plan and propose a few funded next steps with separate long-term goals."
dependencies:
  tools:
    - type: "mcp"
      value: "portfolio_analyser"
      description: "Lokale Portfolio-App für Briefing-Kontext und Veröffentlichung"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
