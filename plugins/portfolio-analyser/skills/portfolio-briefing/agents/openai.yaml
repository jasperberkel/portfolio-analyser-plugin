interface:
  display_name: "Portfolio Briefing"
  short_description: "Anlageplan fortführen und Tageslage einordnen"
  default_prompt: "Use $portfolio-briefing to review my long-term investment plan and publish a German daily briefing about changes since the last successful review."
dependencies:
  tools:
    - type: "mcp"
      value: "portfolio_analyser"
      description: "Lokale Portfolio-App für Briefing-Kontext und Veröffentlichung"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
