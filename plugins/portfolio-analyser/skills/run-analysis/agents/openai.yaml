interface:
  display_name: "Run Analysis"
  short_description: "Research parallel ausführen und Portfolio-Strategie veröffentlichen"
  default_prompt: "Use $run-analysis to complete parallel research, portfolio strategy and atomic publication to Portfolio Analyser."
dependencies:
