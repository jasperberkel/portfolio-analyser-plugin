    - type: "mcp"
      value: "portfolio_analyser"
      description: "Kontext und atomare Veröffentlichung vollständiger Analyse-Läufe"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
