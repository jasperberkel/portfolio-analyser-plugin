interface:
  display_name: "Portfolio Import"
  short_description: "Portfolio importieren und vollständige Analyse starten"
  default_prompt: "Use $portfolio-import to import these portfolio documents and automatically run the complete research and strategy analysis after successful synchronization."
dependencies:
  tools:
    - type: "mcp"
      value: "portfolio_analyser"
      description: "Lokale Portfolio-Web-App für Snapshots und Analysen"
      transport: "streamable_http"
      url: "http://127.0.0.1:8010/mcp"
policy:
  allow_implicit_invocation: true
